name: Validate entries

# The same validator that runs locally and inside the MCP server.
# A pull request cannot merge an entry that breaks the schema, uses a value
# outside a closed list, lacks a source URL, or carries a quote that is not in
# the source post.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validator dependencies
        run: pip install -r requirements.txt
      # Fetches each source post to check the quote. If LessWrong cannot be
      # reached from the runner, the quote check is reported as a warning.
      - name: Validate every entry
        run: python tools/validate.py
      - name: Validate the gold entries
        run: python tools/validate.py --gold

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install all dependencies
        run: pip install -r requirements-dev.txt
      - name: Run the test suite
        run: python -m pytest -q
