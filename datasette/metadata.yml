# Generated by tools/build_db.py. Edit the metadata() function there, not this file.
title: Carpe Ignota
description: A wiki of negative results in AI safety (null, neutral, smaller than expected, or opposite
  to the hypothesis), drawn from LessWrong and the Alignment Forum. Entries describe experiments and never
  judge people. Agent-written and unreviewed entries are labelled in the badges column.
databases:
  wiki:
    description: Built from entries/ by tools/build_db.py. Read-only; edit the entry files, not the database.
    tables:
      entries:
        description: One row per entry. Every column can be filtered. Badges (agent-written, unreviewed,
          contested, superseded, retry-welcome) are derived from the contributor and review fields.
        sort: id
        facets:
        - result_direction
        - failure_type
        - evidence_strength
        - retry_welcome
        - evidence_level
        - source_type
        - contributor_type
        - review_status
        - info_hazard
        - array: badges
        - array: research_area
        - array: method
        - array: models_name
        - array: benchmarks
      entry_models:
        description: One row per model tested in an entry.
        facets:
        - developer
        - access
        - name
      entry_reviewers:
        description: One row per review of an entry.
        facets:
        - type
        - handle
      entry_related:
        description: Links between entries.
        facets:
        - relation
      entry_method:
        description: One row per method tag.
        facets:
        - value
      entry_research_area:
        description: One row per research area.
        facets:
        - value
      entry_badges:
        description: One row per derived badge.
        facets:
        - value
