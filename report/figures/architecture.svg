<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="800" viewBox="0 0 1500 800" font-family="-apple-system, Helvetica, Arial, sans-serif">
<defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
<rect width="1500" height="800" fill="#ffffff"/>
<text x="30" y="28" font-size="15" font-weight="700" fill="#666" letter-spacing="1">WHO PUTS CONTENT IN</text>
<text x="390" y="28" font-size="15" font-weight="700" fill="#666" letter-spacing="1">WHAT EVERY CHANGE PASSES THROUGH</text>
<text x="1075" y="28" font-size="15" font-weight="700" fill="#666" letter-spacing="1">WHERE IT LIVES, AND WHO READS IT</text>
<line x1="175" y1="170" x2="175" y2="250" stroke="#444" stroke-width="2" marker-end="url(#tip)"/>
<line x1="320" y1="327" x2="390" y2="374" stroke="#444" stroke-width="2" marker-end="url(#tip)"/>
<line x1="320" y1="455" x2="390" y2="414" stroke="#444" stroke-width="2" marker-end="url(#tip)"/>
<line x1="670" y1="395" x2="770" y2="395" stroke="#444" stroke-width="2" marker-end="url(#tip)"/>
<line x1="970" y1="395" x2="1075" y2="395" stroke="#444" stroke-width="2" marker-end="url(#tip)"/>
<line x1="218" y1="610" x2="471" y2="470" stroke="#444" stroke-width="2" marker-end="url(#tip)"/>
<line x1="1213" y1="290" x2="1176" y2="150" stroke="#444" stroke-width="2" marker-end="url(#tip)"/>
<line x1="1258" y1="290" x2="1364" y2="150" stroke="#444" stroke-width="2" marker-end="url(#tip)"/>
<line x1="1213" y1="500" x2="1176" y2="640" stroke="#444" stroke-width="2" marker-end="url(#tip)"/>
<line x1="1265" y1="695" x2="1285" y2="695" stroke="#444" stroke-width="2" marker-end="url(#tip)"/>
<rect x="30" y="60" width="290" height="110" rx="10" fill="#eef3f8" stroke="#5b7fa6" stroke-width="2"/>
<text x="44" y="88" font-size="17" font-weight="700" fill="#1c1c1c">LessWrong / Alignment Forum</text>
<text x="44" y="112" font-size="14.5" fill="#333">public write-ups of experiments</text>
<text x="44" y="132" font-size="14.5" fill="#333">that did not work</text>
<rect x="30" y="250" width="290" height="110" rx="10" fill="#f4efe6" stroke="#a07c3b" stroke-width="2"/>
<text x="44" y="278" font-size="17" font-weight="700" fill="#1c1c1c">AI agent</text>
<text x="44" y="302" font-size="14.5" fill="#333">contribute skill drafts an entry</text>
<text x="44" y="322" font-size="14.5" fill="#333">from a post (MCP: submit_entry)</text>
<rect x="30" y="420" width="290" height="110" rx="10" fill="#f4efe6" stroke="#a07c3b" stroke-width="2"/>
<text x="44" y="448" font-size="17" font-weight="700" fill="#1c1c1c">Person</text>
<text x="44" y="472" font-size="14.5" fill="#333">GitHub issue form</text>
<text x="44" y="492" font-size="14.5" fill="#333">(or edits a file directly)</text>
<rect x="30" y="610" width="290" height="110" rx="10" fill="#f4efe6" stroke="#a07c3b" stroke-width="2"/>
<text x="44" y="638" font-size="17" font-weight="700" fill="#1c1c1c">Reviewer: person or agent</text>
<text x="44" y="662" font-size="14.5" fill="#333">review skill checks an entry</text>
<text x="44" y="682" font-size="14.5" fill="#333">against its post</text>
<rect x="390" y="320" width="280" height="150" rx="10" fill="#fdeeee" stroke="#b4443c" stroke-width="2"/>
<text x="404" y="348" font-size="17" font-weight="700" fill="#1c1c1c">One validator on every path</text>
<text x="404" y="372" font-size="14.5" fill="#333">schema and closed lists</text>
<text x="404" y="392" font-size="14.5" fill="#333">source link required</text>
<text x="404" y="412" font-size="14.5" fill="#333">quote (15 words or fewer) must be</text>
<text x="404" y="432" font-size="14.5" fill="#333">found in the fetched post</text>
<rect x="770" y="335" width="200" height="120" rx="10" fill="#fdeeee" stroke="#b4443c" stroke-width="2"/>
<text x="784" y="363" font-size="17" font-weight="700" fill="#1c1c1c">Pull request</text>
<text x="784" y="387" font-size="14.5" fill="#333">one branch per entry</text>
<text x="784" y="407" font-size="14.5" fill="#333">merge only if valid</text>
<rect x="1075" y="290" width="300" height="210" rx="10" fill="#eaf5ee" stroke="#3c7d55" stroke-width="2"/>
<text x="1089" y="318" font-size="17" font-weight="700" fill="#1c1c1c">entries/*.md in git</text>
<text x="1089" y="342" font-size="14.5" fill="#333">the source of truth</text>
<text x="1089" y="362" font-size="14.5" fill="#333">trust fields set by the system:</text>
<text x="1089" y="382" font-size="14.5" fill="#333">who wrote it (a person, or an</text>
<text x="1089" y="402" font-size="14.5" fill="#333">agent and its model),</text>
<text x="1089" y="422" font-size="14.5" fill="#333">review status, dates</text>
<text x="1089" y="442" font-size="14.5" fill="#333">history of every change</text>
<rect x="1075" y="50" width="190" height="100" rx="10" fill="#f0edf8" stroke="#6a56a8" stroke-width="2"/>
<text x="1089" y="78" font-size="17" font-weight="700" fill="#1c1c1c">Static web page</text>
<text x="1089" y="102" font-size="14.5" fill="#333">filter on every field</text>
<text x="1089" y="122" font-size="14.5" fill="#333">badges on every card</text>
<rect x="1285" y="50" width="190" height="100" rx="10" fill="#f0edf8" stroke="#6a56a8" stroke-width="2"/>
<text x="1299" y="78" font-size="17" font-weight="700" fill="#1c1c1c">Datasette</text>
<text x="1299" y="102" font-size="14.5" fill="#333">table, facets, SQL,</text>
<text x="1299" y="122" font-size="14.5" fill="#333">JSON</text>
<rect x="1075" y="640" width="190" height="110" rx="10" fill="#f0edf8" stroke="#6a56a8" stroke-width="2"/>
<text x="1089" y="668" font-size="17" font-weight="700" fill="#1c1c1c">MCP server and CLI</text>
<text x="1089" y="692" font-size="14.5" fill="#333">search, get, facets,</text>
<text x="1089" y="712" font-size="14.5" fill="#333">fetch source</text>
<rect x="1285" y="640" width="190" height="110" rx="10" fill="#f0edf8" stroke="#6a56a8" stroke-width="2"/>
<text x="1299" y="668" font-size="17" font-weight="700" fill="#1c1c1c">ask skill</text>
<text x="1299" y="692" font-size="14.5" fill="#333">&quot;what has been tried,</text>
<text x="1299" y="712" font-size="14.5" fill="#333">where did it go wrong,</text>
<text x="1299" y="732" font-size="14.5" fill="#333">what should I avoid?&quot;</text>
<text x="175" y="200" font-size="14" fill="#444" text-anchor="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke">reads</text>
<text x="720" y="385" font-size="14" fill="#444" text-anchor="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke">passes</text>
<text x="1022" y="385" font-size="14" fill="#444" text-anchor="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke">merge</text>
<text x="345" y="530" font-size="14" fill="#444" text-anchor="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke">review</text>
</svg>