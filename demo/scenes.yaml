# The demo, scene by scene. One source for both the narration script
# (demo/script.md) and the video (demo/out/demo-draft.mp4), so they cannot drift.
#
# Build:  make demo-script   (script only)      make demo-video   (script + video)
#         make demo-short    (the short cut: scenes marked `short: false` are left out)
#
# Scene kinds:
#   card       title, optional subtitle, bullet lines, footer
#   page       the real browse page, driven beat by beat: each beat is one sentence of
#              narration (`say`) plus the actions done while it is spoken (`actions`):
#              tick / untick a facet value, type in the search box, clear, open an entry,
#              scroll, scroll_to an entry, scroll_top, scroll_panel, panel_top, show_field
#              (scroll to a field of an open entry and outline it)
#   terminal   real commands, run when the video is built; the command is shown first, then
#              its real output. `expect_fail` lists the commands (1-based) that must fail.
#   file       an excerpt of a real file in the repository
#   datasette  Datasette's own pages, served in process; each beat may give a `path`
#
# `facts` are the numbers the narration says out loud. The build checks them
# against the repository and stops if one is out of date.
#
# This version answers a cold review by a first-time viewer (DECISION-LOG.md, DEC-70):
# the problem and its cost come first, each claim is backed by what is on screen, and
# terms are explained where they first appear.

title: "Failed-experiments wiki demo"
voice: "Samantha"          # macOS `say` voice for the scratch narration track
voice_rate: 175             # words a minute for that voice
words_per_minute: 175       # used to estimate timings when no audio is generated

facts:
  entries: 15
  posts_classified: 212
  genuine_writeups: 49
  full_field_posts: 9
  contribute_accuracy_percent: 78
  ask_passed: 6
  ask_total: 7
  gold_verified: 0           # how many of the 5 gold entries are verified
  agent_written: 15          # entries whose contributor is an agent
  reviewed: 1                # entries with review.status reviewed
  reviewed_by_a_person: 0
  has_github_remote: true

scenes:
  - id: s01-title
    kind: card
    title: "A wiki of failed AI-safety experiments"
    subtitle: "that people and AI agents can both write to, and both read"
    footer: "Apart Research · AI x Epistemics Sprint · Track 2, Trust Infrastructure: signals that people and machines can both read, and know how far to trust"
    narration: >
      When an AI-safety experiment does not work, the result usually stays in a file drawer, or in a post nobody can find.
      For AI safety, I found no shared record of what was tried and where it failed.
      So the next team repeats the dead end, and scarce safety compute goes to ideas that were already ruled out.
      This is a proof of concept of a fix: a wiki of failed experiments that people and AI agents can both write to, and both read.

  - id: s02-idea
    kind: card
    title: "Less wrong, one experiment at a time"
    bullets:
      - "Starts where people already post candid write-ups of what did not work: LessWrong and the Alignment Forum."
      - "Blameless. Entries describe experiments, never people."
      - "Trust is visible. Who wrote it, on what evidence, and whether anyone checked."
      - "A failure is scoped. One report is not \"this never works\"."
    narration: >
      It starts with what is already public but hard to find: LessWrong and the Alignment Forum, a community that already posts candid write-ups of what did not work.
      LessWrong's own name states the goal: be less wrong. Repeating a known mistake, or ignoring evidence that is one search away, is the habit this is aimed at.
      The habit, never the person: entries describe experiments, and do not judge whoever ran them.
      And every failure is scoped, so one thin report is not read as: this never works.

  - id: s03-browse
    kind: page
    beats:
      - say: "This is the wiki: one web page, built from plain text files."
      - say: "Fifteen entries so far, each from a real post."
        actions:
          - {do: scroll, px: 420}
      - say: "Two badges say how far to trust an entry, and one invites a retry. So far all fifteen were written by an agent, and the only review was done by an agent too."
        actions:
          - {do: scroll_to, entry: fe-2026-0006}
      - say: "The first five are model drafts of my own reference entries, and each of those five says so until I verify it."
        actions:
          - {do: scroll_top}
    update_when: "The last sentence goes once the gold entries are verified. The count changes if entries are added."

  - id: s04-filter
    kind: page
    beats:
      - say: "Every field is a filter, from the result to the source."
        actions:
          - {do: scroll_panel, px: 1500}
          - {do: panel_top}
      - say: "Here are the failures where the settings were never properly explored."
        actions:
          - {do: tick, field: failure_type, value: hyperparams_unexplored}
      - say: "Here, the ones where the hypothesis itself looks false, yet a retry is still welcome."
        actions:
          - {do: untick, field: failure_type, value: hyperparams_unexplored}
          - {do: tick, field: badges, value: retry-welcome}
          - {do: tick, field: failure_type, value: hypothesis_false}
      - say: "And a search across every field."
        actions:
          - {do: clear}
          - {do: type, text: steganography}

  - id: s05-entry
    kind: page
    start_link: "q=steganography"
    beats:
      - say: "Open one."
        actions:
          - {do: open, entry: fe-2026-0010}
      - say: "It links the original post, and carries a short quote that a program found, word for word, in that post."
        actions:
          - {do: show_field, entry: fe-2026-0010, field: quote}
      - say: "Claim scope says exactly what was tested: one setup, one small model, two hundred training steps."
        actions:
          - {do: show_field, entry: fe-2026-0010, field: claim_scope}
      - say: "Confidence that this is a true negative, meaning the idea really fails and the test was not just weak: low."
        actions:
          - {do: show_field, entry: fe-2026-0010, field: confidence_true_negative}
      - say: "Retry welcome: yes. The entry records the post's own view that a stronger setup would very likely succeed."
        actions:
          - {do: show_field, entry: fe-2026-0010, field: retry_welcome}
          - {do: show_field, entry: fe-2026-0010, field: limitations}
      - say: "So it warns you about a pitfall, without telling you the idea is dead."

  - id: s06-file
    kind: file
    short: false
    path: "entries/fe-2026-0005.md"
    ranges: [[1, 18], [34, 51]]
    wrap: true
    narration: >
      Underneath, an entry is one text file with structured fields: the hypothesis, exactly what was tested,
      the result, the kind of failure, and its limits.
      Every change to it goes through git, so the history of what was agreed, and why, is kept.

  - id: s07-ask
    kind: terminal
    commands:
      - 'python tools/cli.py search "steer evaluation awareness direction to stop sandbagging" --brief --limit 3'
    wrap: true
    narration: >
      Now the question this is for. Say a researcher plans to steer a model along a direction for
      "it thinks it is being evaluated", to stop it sandbagging, that is, underperforming on purpose.
      Has that been tried? A keyword search ranks first the one entry that tested exactly this.

  - id: s07b-plugin
    kind: file
    path: "demo/answers/plugin-session.md"
    first_line: 1
    last_line: 18
    wrap: true
    note: "A saved transcript of a real headless Claude Code session with the plugin loaded, run on 2026-11-15 with only the wiki's own tools available. `make verify PLUGIN=1` repeats it."
    narration: >
      AI agents reach the wiki through a plugin. This is a real session:
      the agent lists the six tools the wiki gives it, runs a search through them,
      and reports that both entries it found are unreviewed.

  - id: s08-answer
    kind: file
    path: "demo/answers/steering.md"
    ranges: [[1, 7], [9, 19], [29, 38]]
    wrap: true
    note: "Written by the ask skill through the plugin, in a headless Claude Code session on 2026-11-15, against the 15-entry wiki. It is not one of the scored answers (those were written when the wiki held 10 entries) and no judge has scored it; every statement in it was read against the two entries it cites."
    narration: >
      For this demo, an AI agent then wrote this answer, following the ask skill, a set of instructions, and reading the wiki through its plugin.
      Five parts, always the same: already tried, where it went wrong, what to avoid, worth retrying, and not found.
      Every claim cites its entry, and here they all rest on one.
      It does not turn a weak result into a verdict: the dose was gentle, so it says this is not evidence that the idea fails.
      It ends by saying that all of it rests on one unreviewed entry.
      Nobody has scored this answer for accuracy.

  - id: s09-notfound
    kind: file
    short: false
    path: "demo/answers/debate.md"
    first_line: 1
    last_line: 17
    wrap: true
    note: "Written by the ask skill through the plugin, in a headless Claude Code session on 2026-11-15, against the 15-entry wiki. Not one of the scored answers."
    narration: >
      Ask about something the wiki does not cover, here debate with human judges, and it says so plainly:
      nothing matches, and that means nobody has filed an entry, not that the idea is untested.
      It does not fill the gap from its own memory.

  - id: s10-contribute
    kind: terminal
    commands:
      - "git log --graph --format='%h %s' --grep='fe-2026-0012'"
      - "grep -A5 -E '^(contributor|review):' entries/fe-2026-0012.md"
    wrap: true
    narration: >
      Agents also write: the contribute skill reads a post, drafts an entry for each failed experiment, and submits it.
      Each submission lands on its own branch, and merges only if validation passes.
      The system, not the agent, writes the trust fields: written by an agent, which model, unreviewed.
      A draft that claims otherwise is overwritten, and merging is not review.
    update_when: "Once a pull request exists for an entry, show it instead of the local branch graph."

  - id: s11-validate
    kind: terminal
    commands:
      - "sed 's/^failure_type: .*/failure_type: bad_luck/' entries/fe-2026-0008.md > $TMP/fe-2026-0008.md; python tools/validate.py $TMP/fe-2026-0008.md --quotes cached"
      - "sed 's/^  quote: .*/  quote: This sentence is not in the post./' entries/fe-2026-0008.md > $TMP/fe-2026-0008.md; python tools/validate.py $TMP/fe-2026-0008.md --quotes cached"
      - "python tools/validate.py --quotes cached"
    expect_fail: [1, 2]
    wrap: true
    narration: >
      One validator guards every path. Change a failure type to a value that is not on the list, and it refuses.
      Change the quote to a sentence the post never said, and it refuses that too, checking against a saved copy of the post.
      All fifteen real entries pass. It checks form and quotes, not whether a summary is right.

  - id: s12-human
    kind: file
    short: false
    path: ".github/ISSUE_TEMPLATE/new-entry.yml"
    first_line: 1
    last_line: 26
    wrap: true
    narration: >
      People contribute by filling in a form, with no git needed.
      A script turns the form into an entry marked as written by a person.
      The form and the script are tested on this machine. Nobody has submitted the form on GitHub yet.
    update_when: "Drop the last sentence, and show the real issue and pull request, once the workflow has run on GitHub."

  - id: s13-review
    kind: terminal
    short: false
    commands:
      - "git log --date=short --format='%h %ad %s' --grep='Review fe-2026-0007'"
      - "grep -A10 '^review:' entries/fe-2026-0007.md"
    wrap: true
    narration: >
      Review is a separate step. A person or an agent checks an entry against its post, and records who reviewed, when, and what they checked.
      This one was reviewed by an agent, the same model that wrote it. The record names the model,
      and the page labels it: reviewed by an agent only.
      No person has reviewed an entry yet.
    update_when: "Add your own human review here once it is done, and drop the last sentence."

  - id: s14-datasette
    kind: datasette
    short: false
    beats:
      - say: "For people who want a table, SQL and JSON, the same entries load into Datasette."
        path: "/wiki/entries"
      - say: "It offers a facet on every field, and one click filters the table."
        path: "/wiki/entries?failure_type=hypothesis_false"

  - id: s15-evals
    kind: terminal
    short: false
    commands:
      - "cp -R evals/results $TMP/results && python evals/run_evals.py --results $TMP/results"
      - "grep -E 'Overall field accuracy|^. Field|failure_type|source.url|models.name|.method.|checks_done|hypothesis|claim_scope|limitations' $TMP/results/RESULTS.md | cut -c1-96 | head -10"
    wrap: true
    narration: >
      The skills are scored with one command. The contribute skill's drafts are compared, field by field,
      with five reference entries: seventy-eight percent agreement overall.
      Source fields agree fully. Free-text tags never matched exactly: zero percent, because two careful readers pick different words.
      The ask skill passed six of seven questions, scored when the wiki held ten entries. The miss was a detail the entry does not state.
      These numbers are provisional. The reference entries are still model drafts, and one company's models wrote the drafts, the references and the grades.
    update_when: "Re-run after the gold entries are verified, and say the new numbers. Drop 'provisional' only then."

  - id: s16-finding
    kind: card
    title: "A finding from building it"
    bullets:
      - "212 candidate posts from keyword and tag searches, labelled by a small model"
      - "49 are genuine write-ups of failed experiments"
      - "9 state enough to fill every required field (checked field by field by a stronger model)"
      - "Of the 40 that fall short: 20 lack a stated expectation, 18 lack exactly what was tested"
      - "The wiki's 15 entries come from those 9 posts and 1 stated exception; a post can report several experiments"
    narration: >
      Building it produced a finding. A small model labelled two hundred and twelve candidate posts,
      and judged forty-nine to be genuine write-ups of failed experiments.
      A stronger model then checked each of those, field by field. Only nine stated enough to fill a structured entry.
      What the other forty most often left out: what the authors expected, and exactly what they tested.
      Those are the same two things a reader needs, to avoid reading a failure report as: this never works.

  - id: s17-close
    kind: card
    title: "Each experiment can be less wrong than the one before it"
    subtitle: "Where this stands, and what comes next"
    bullets:
      - "So far: 15 entries, all written by an agent. One review, by an agent. None by a person."
      - "A proof of concept in a private repository. Not public yet."
      - "First: ask the authors. They can confirm their entries, or opt out."
      - "Then: a public site, and a hosted server so agents connect without cloning"
      - "Then: more sources than LessWrong and the Alignment Forum"
    narration: >
      This is a proof of concept, not public yet. No person has written or reviewed an entry so far, and no author has been contacted.
      Before it goes public, the authors get asked: they can confirm their entries, or opt out.
      After that, a public site and a hosted server for agents.
      If you remember one thing, make it the aim: each experiment can be less wrong than the one before it. Thank you.
